<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script>
            AFRAME.registerComponent('videohandler', {
                schema: { videoId: { type: 'string' } },
                init: function () {
                    var marker = this.el;
                    var vid = document.querySelector(this.data.videoId);
                    // Pausa il video inizialmente
                    vid.pause();

                    marker.addEventListener('markerFound', function () {
                        console.log('Marker trovato, video in avvio');
                        vid.play();  // Avvia il video
                    });

                    marker.addEventListener('markerLost', function () {
                        console.log('Marker perso, video in pausa');
                        vid.pause();  // Pausa il video
                    });
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
            embedded
        >
            <a-assets>
                <!-- Caricamento del primo video -->
                <video id="vid1" src="assets/asset.mp4" preload="auto" playsinline></video>
                <!-- Caricamento del secondo video -->
                <video id="vid2" src="assets/asset2.mp4" preload="auto" muted playsinline></video>
                <!-- Caricamento del terzo video -->
                <video id="vid3" src="assets/asset3.mp4" preload="auto" muted playsinline></video>
                <!-- Caricamento del quarto video -->
                <video id="vid4" src="assets/asset4.mp4" preload="auto" muted playsinline></video>
                <!-- Caricamento del quarto video -->
                <video id="vid5" src="assets/asset5.mp4" preload="auto" muted playsinline></video>
            </a-assets>

            <!-- Marker per il primo video -->
            <a-marker
                type="pattern"
                url="assets/marker.patt"
                videohandler="videoId: #vid1"
            >
                <a-video src="#vid1" scale="1 1 1" position="0 0.3 0" rotation="-90 0 0"></a-video>
            </a-marker>

            <!-- Marker per il secondo video -->
            <a-marker
                type="pattern"
                url="assets/marker2.patt"
                videohandler="videoId: #vid2"
            >
                <a-video src="#vid2" scale="1 1 1" position="0 0.3 0" rotation="-90 0 0"></a-video>
            </a-marker>

             <!-- Marker per il terzo video -->
            <a-marker
                type="pattern"
                url="assets/marker3.patt"
                videohandler="videoId: #vid3"
            >
                <a-video src="#vid3" scale="1 1 1" position="0 0.3 0" rotation="-90 0 0"></a-video>
          
            </a-marker>

              <!-- Marker per il quarto video -->
            <a-marker
                type="pattern"
                url="assets/marker4.patt"
                videohandler="videoId: #vid4"
            >
                <a-video src="#vid4" scale="1 1 1" position="0 0.3 0" rotation="-90 0 0"></a-video>
          
            </a-marker>
            
            <!-- Marker per il quarto video -->
            <a-marker
                type="pattern"
                url="assets/marker5.patt"
                videohandler="videoId: #vid5"
            >
                <a-video src="#vid5" scale="1 1 1" position="0 0.3 0" rotation="-90 0 0"></a-video>
          
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
