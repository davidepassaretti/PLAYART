<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
        >
            <!-- Caricamento video -->
            <a-assets>
                <video id="vid1" src="assets/asset.mp4" preload="auto" muted playsinline></video>
                <video id="vid2" src="assets/asset2.mp4" preload="auto" muted playsinline></video>
            </a-assets>

            <!-- Marker 1 con video -->
            <a-marker type="pattern" url="assets/marker.patt">
                <a-video src="#vid1" scale="1 1 1" position="0 0.3 0" rotation="-90 0 0"></a-video>
            </a-marker>

            <!-- Marker 2 con video -->
            <a-marker type="pattern" url="assets/marker2.patt">
                <a-video src="#vid2" scale="1 1 1" position="0 0.3 0" rotation="-90 0 0"></a-video>
            </a-marker>

            <!-- Camera -->
            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
